name: Build Windows Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify version matches tag
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ("v$($package.version)" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $($package.version)"
          }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run JavaScript checks
        run: npm run check

      - name: Create Windows installer and portable build
        run: npm run build:win

      - name: Verify updater metadata exists
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/latest.yml')) { throw 'Update metadata dist/latest.yml was not generated' }
          if (!(Get-ChildItem 'dist/Nova-Browser-Setup-*.exe')) { throw 'NSIS installer was not generated' }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nova Browser ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/Nova-Browser-Setup-*.exe
            dist/Nova-Browser-Portable-*.exe
            dist/*.blockmap
            dist/latest.yml
          fail_on_unmatched_files: true
